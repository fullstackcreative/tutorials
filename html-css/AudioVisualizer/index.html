<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Audio Visualizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="game">
      <svg viewBox="0 0 500 500" class="grid-svg">
        <defs>
          <pattern
            id="grid"
            width="50"
            height="50"
            patternUnits="userSpaceOnUse"
          >
            <path
              d="M 50 0 L 0 0 0 50"
              fill="none"
              stroke="#39ff14"
              stroke-width="1"
              opacity="0.3"
            />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
      </svg>
     <div class="section">
      <div class="visualizer" id="visualizer">
         <audio id="audio" src="Lock.mp3" crossorigin="anonymous"></audio>

      </div>
     </div>
     
    
    </div>
    <div class="controls">
      <button id="playBtn">▶</button>
      <button id="stopBtn">■</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
